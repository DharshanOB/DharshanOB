<svg width="100%" height="240" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0d1e"/>
      <stop offset="45%" stop-color="#1f1838"/>
      <stop offset="75%" stop-color="#4d2b45"/>
      <stop offset="95%" stop-color="#8c4843"/>
      <stop offset="100%" stop-color="#b86949"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e63900"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffea66"/>
    </linearGradient>
    <filter id="pixelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffaa00" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) translateY(0); }
      25% { transform: scale(1.05, 0.95) translateY(-1px); }
      50% { transform: scale(0.95, 1.05) translateY(-2px); }
      75% { transform: scale(1.02, 0.98) translateY(-1px); }
    }
    @keyframes smokeDrift {
      0% { opacity: 0.8; transform: translateY(0) translateX(0) scale(1); }
      50% { opacity: 0.5; transform: translateY(-16px) translateX(6px) scale(1.4); }
      100% { opacity: 0; transform: translateY(-32px) translateX(12px) scale(2); }
    }
    @keyframes windowPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #ffb300); }
    }
    .star { animation: starTwinkle 3s infinite ease-in-out; }
    .star-fast { animation: starTwinkle 1.8s infinite ease-in-out; }
    .star-slow { animation: starTwinkle 4.2s infinite ease-in-out; }
    .flame { animation: flameFlicker 0.4s infinite ease-in-out; transform-origin: 755px 190px; }
    .smoke-1 { animation: smokeDrift 2.4s infinite linear; }
    .smoke-2 { animation: smokeDrift 2.4s infinite linear 0.8s; }
    .smoke-3 { animation: smokeDrift 2.4s infinite linear 1.6s; }
    .cozy-window { animation: windowPulse 4s infinite ease-in-out; }
    .pixel-title {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 26px;
      font-weight: bold;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .pixel-sub {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #72f772;
      letter-spacing: 1px;
    }
    .pixel-coords {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      fill: #e8a848;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Sky Background -->
  <rect width="900" height="240" fill="url(#skyGrad)"/>

  <!-- Pixel Moon -->
  <g transform="translate(100, 30)">
    <rect x="0" y="0" width="32" height="32" fill="#fffbe8"/>
    <rect x="2" y="2" width="28" height="28" fill="#fffdf2"/>
    <rect x="6" y="6" width="6" height="6" fill="#ded7ba"/>
    <rect x="18" y="10" width="8" height="6" fill="#ded7ba"/>
    <rect x="10" y="20" width="10" height="6" fill="#ded7ba"/>
  </g>

  <!-- Twinkling Pixel Stars -->
  <rect class="star" x="60" y="45" width="4" height="4" fill="#ffffff"/>
  <rect class="star-fast" x="180" y="30" width="3" height="3" fill="#ffeaa7"/>
  <rect class="star-slow" x="260" y="55" width="4" height="4" fill="#ffffff"/>
  <rect class="star" x="340" y="25" width="3" height="3" fill="#ffffff"/>
  <rect class="star-fast" x="420" y="40" width="4" height="4" fill="#ffeaa7"/>
  <rect class="star-slow" x="510" y="28" width="3" height="3" fill="#ffffff"/>
  <rect class="star" x="620" y="35" width="4" height="4" fill="#ffffff"/>
  <rect class="star-fast" x="710" y="20" width="3" height="3" fill="#ffeaa7"/>
  <rect class="star-slow" x="830" y="45" width="4" height="4" fill="#ffffff"/>
  <rect class="star" x="780" y="60" width="3" height="3" fill="#ffffff"/>

  <!-- Distant Pixel Pine Mountains / Silhouette (Back Layer) -->
  <path d="M 0 170 L 60 145 L 120 170 L 190 140 L 260 170 L 350 135 L 430 170 L 520 138 L 600 170 L 690 142 L 780 170 L 850 148 L 900 165 L 900 240 L 0 240 Z" fill="#131b26"/>

  <!-- Midground Pine Trees -->
  <g fill="#1a2e24">
    <!-- Tree 1 -->
    <polygon points="50,175 42,160 58,160"/>
    <polygon points="50,162 44,150 56,150"/>
    <polygon points="50,152 46,142 54,142"/>
    <rect x="49" y="175" width="3" height="7" fill="#2d1c13"/>

    <!-- Tree 2 -->
    <polygon points="120,178 110,160 130,160"/>
    <polygon points="120,163 113,148 127,148"/>
    <polygon points="120,150 115,138 125,138"/>
    <rect x="118" y="178" width="4" height="7" fill="#2d1c13"/>

    <!-- Tree 3 -->
    <polygon points="210,176 202,162 218,162"/>
    <polygon points="210,164 204,152 216,152"/>
    <rect x="209" y="176" width="3" height="6" fill="#2d1c13"/>

    <!-- Tree 4 -->
    <polygon points="630,178 620,160 640,160"/>
    <polygon points="630,162 622,147 638,147"/>
    <polygon points="630,149 624,136 636,136"/>
    <rect x="628" y="178" width="4" height="8" fill="#2d1c13"/>

    <!-- Tree 5 -->
    <polygon points="675,176 668,162 682,162"/>
    <polygon points="675,163 670,150 680,150"/>
    <rect x="674" y="176" width="3" height="6" fill="#2d1c13"/>
  </g>

  <!-- Foreground Dirt and Grass Blocks -->
  <!-- Top Grass Surface -->
  <rect x="0" y="180" width="900" height="12" fill="#5b8e31"/>
  <rect x="0" y="180" width="900" height="3" fill="#75b340"/>
  <!-- Grass Pixel Drips -->
  <g fill="#5b8e31">
    <rect x="15" y="192" width="6" height="4"/>
    <rect x="45" y="192" width="6" height="6"/>
    <rect x="85" y="192" width="8" height="5"/>
    <rect x="140" y="192" width="6" height="6"/>
    <rect x="195" y="192" width="8" height="4"/>
    <rect x="250" y="192" width="6" height="5"/>
    <rect x="310" y="192" width="8" height="6"/>
    <rect x="380" y="192" width="6" height="4"/>
    <rect x="440" y="192" width="8" height="6"/>
    <rect x="520" y="192" width="6" height="5"/>
    <rect x="600" y="192" width="8" height="4"/>
    <rect x="680" y="192" width="6" height="6"/>
    <rect x="760" y="192" width="8" height="5"/>
    <rect x="830" y="192" width="6" height="4"/>
    <rect x="880" y="192" width="8" height="6"/>
  </g>
  <!-- Dirt Base -->
  <rect x="0" y="192" width="900" height="48" fill="#866043"/>
  <!-- Dirt Texture Specks -->
  <g fill="#5c4028">
    <rect x="25" y="202" width="6" height="6"/>
    <rect x="70" y="215" width="8" height="6"/>
    <rect x="130" y="200" width="6" height="6"/>
    <rect x="180" y="218" width="6" height="6"/>
    <rect x="240" y="205" width="8" height="6"/>
    <rect x="300" y="220" width="6" height="6"/>
    <rect x="360" y="202" width="6" height="6"/>
    <rect x="420" y="215" width="8" height="6"/>
    <rect x="500" y="204" width="6" height="6"/>
    <rect x="570" y="218" width="8" height="6"/>
    <rect x="640" y="202" width="6" height="6"/>
    <rect x="720" y="216" width="6" height="6"/>
    <rect x="800" y="204" width="8" height="6"/>
    <rect x="860" y="218" width="6" height="6"/>
  </g>

  <!-- Cozy Wooden Cabin (Right Side) -->
  <g transform="translate(805, 115)">
    <!-- Chimney Cobblestone -->
    <rect x="52" y="0" width="16" height="30" fill="#525252"/>
    <rect x="50" y="-3" width="20" height="4" fill="#383838"/>
    <!-- Chimney Smoke Particles -->
    <g transform="translate(56, -4)">
      <rect class="smoke-1" x="0" y="0" width="6" height="6" fill="#a0a0a0"/>
      <rect class="smoke-2" x="0" y="0" width="6" height="6" fill="#b8b8b8"/>
      <rect class="smoke-3" x="0" y="0" width="6" height="6" fill="#d0d0d0"/>
    </g>

    <!-- Roof (Dark Oak Stairs) -->
    <polygon points="40,15 -5,45 85,45" fill="#3b2615"/>
    <polygon points="40,12 -8,46 88,46" fill="#2d1b0c" opacity="0.3"/>

    <!-- Wood Plank Walls (Spruce) -->
    <rect x="2" y="45" width="76" height="25" fill="#6a492d"/>
    <!-- Horizontal Plank Lines -->
    <line x1="2" y1="53" x2="78" y2="53" stroke="#48311e" stroke-width="1.5"/>
    <line x1="2" y1="61" x2="78" y2="61" stroke="#48311e" stroke-width="1.5"/>

    <!-- Glowing Window -->
    <g class="cozy-window">
      <rect x="14" y="49" width="18" height="15" fill="#ffa726"/>
      <rect x="16" y="51" width="14" height="11" fill="#ffe082"/>
      <!-- Window Frame Pane -->
      <line x1="23" y1="49" x2="23" y2="64" stroke="#48311e" stroke-width="2"/>
      <line x1="14" y1="56" x2="32" y2="56" stroke="#48311e" stroke-width="2"/>
    </g>

    <!-- Oak Door -->
    <rect x="46" y="49" width="16" height="21" fill="#4a3118"/>
    <rect x="48" y="52" width="5" height="7" fill="#664422"/>
    <rect x="48" y="61" width="5" height="7" fill="#664422"/>
    <rect x="58" y="60" width="2" height="3" fill="#d4af37"/>
  </g>

  <!-- Cozy Campfire (Middle Right) -->
  <g transform="translate(725, 172)">
    <!-- Campfire Logs -->
    <rect x="6" y="9" width="24" height="4" rx="1" fill="#382110" transform="rotate(-18 18 11)"/>
    <rect x="6" y="9" width="24" height="4" rx="1" fill="#382110" transform="rotate(18 18 11)"/>
    <rect x="8" y="8" width="20" height="3" fill="#241409"/>

    <!-- Glowing Charcoal Base -->
    <rect x="12" y="7" width="12" height="4" fill="#d83a17"/>
    <rect x="14" y="6" width="8" height="3" fill="#ff7700"/>

    <!-- Animated Flames -->
    <g class="flame" filter="url(#pixelGlow)">
      <polygon points="18,-6 13,7 23,7" fill="url(#fireGrad)"/>
      <polygon points="18,-1 15,7 21,7" fill="#ffea88"/>
    </g>

    <!-- Floating Fire Embers -->
    <rect class="smoke-1" x="16" y="-8" width="2" height="2" fill="#ffaa00"/>
    <rect class="smoke-2" x="19" y="-14" width="2" height="2" fill="#ffdd44"/>
    <rect class="smoke-3" x="15" y="-20" width="2" height="2" fill="#ff6600"/>
  </g>

  <!-- Hanging Lantern on Wooden Post (Left of Campfire) -->
  <g transform="translate(695, 155)">
    <!-- Wooden Fence Post -->
    <rect x="2" y="0" width="4" height="26" fill="#52361b"/>
    <rect x="2" y="2" width="10" height="3" fill="#52361b"/>
    <!-- Lantern -->
    <rect x="8" y="5" width="8" height="10" fill="#222222"/>
    <rect x="9" y="7" width="6" height="6" fill="#ffb703" filter="url(#pixelGlow)"/>
    <rect x="11" y="9" width="2" height="2" fill="#ffffff"/>
  </g>

  <!-- Profile Text & Telemetry (Left & Center) -->
  <g transform="translate(45, 68)">
    <!-- Biome / Coordinate Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="24" fill="#0c1017" fill-opacity="0.8" rx="3" stroke="#374151" stroke-width="1.5"/>
      <text x="12" y="16" class="pixel-coords">XYZ: 128 / 64 / -256  [BIOME: SYSTEMS]</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="58" class="pixel-title">DHARSHAN // COZY BASE</text>

    <!-- Subtitle Roles in Minecraft Monospace -->
    <text x="0" y="86" class="pixel-sub">&gt; LEVEL 99 ARCHITECT // SURVIVAL MODE</text>
    <text x="0" y="106" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="0.5">COMPILERS + AST . FRAPPE &amp; ERPNEXT . HIGH PERF</text>
  </g>
</svg>